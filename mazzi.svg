<svg xmlns="http://www.w3.org/2000/svg" width="760" height="170" viewBox="0 0 760 170" role="img" aria-label="Mazzi - current project" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#171030"/>
    </linearGradient>
    <linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="760" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#2a2f3a"/><stop offset="0.4" stop-color="#8b7bff"/><stop offset="0.6" stop-color="#00f0ff"/><stop offset="1" stop-color="#2a2f3a"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="760 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#a99bff"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="758" height="168" rx="18" fill="url(#card)" stroke="url(#edge)" stroke-width="1.5"/>
  <text x="40" y="52" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" letter-spacing="4" fill="#8b93a7">CURRENT PROJECT</text>
  <text x="40" y="108" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="56" font-weight="800" fill="url(#name)">Mazzi</text>
  <circle cx="44" cy="141" r="4" fill="#39ff88">
    <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="58" y="146" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#c9d1d9">In active development</text>
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#c9d1d9" text-anchor="middle">
    <rect x="540" y="68" width="76" height="32" rx="16" fill="#8b7bff" fill-opacity="0.14" stroke="#8b7bff" stroke-opacity="0.5"/>
    <text x="578" y="89">C++</text>
    <rect x="628" y="68" width="76" height="32" rx="16" fill="#00f0ff" fill-opacity="0.10" stroke="#00f0ff" stroke-opacity="0.45"/>
    <text x="666" y="89">C#</text>
  </g>
</svg>
